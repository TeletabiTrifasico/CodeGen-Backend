openapi: 3.1.0
info:
  title: Banking API
  description: Banking System REST API
  version: v1
servers:
  - url: http://localhost:8080
    description: Generated server url
security:
  - bearerAuth: []
tags:
  - name: ATM
    description: ATM deposit and withdrawal operations
  - name: Accounts
    description: Bank account operations
  - name: Authentication
    description: Register, login, and logout
  - name: Users
    description: User management (employee only)
  - name: Transactions
    description: Transaction operations
paths:
  /api/users/{id}/approve:
    put:
      tags:
        - Users
      summary: Approve a customer account and create their checking and saving accounts
      operationId: approveUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserDTO'
  /api/accounts/{iban}/daily-limit:
    put:
      tags:
        - Accounts
      summary: Update the daily limit of an account (employee only)
      operationId: updateDailyLimit
      parameters:
        - name: iban
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDailyLimitRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AccountDTO'
  /api/accounts/{iban}/close:
    put:
      tags:
        - Accounts
      summary: Close a customer account (employee only)
      operationId: closeAccount
      parameters:
        - name: iban
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AccountDTO'
  /api/accounts/{iban}/absolute-limit:
    put:
      tags:
        - Accounts
      summary: Update the absolute limit of an account (employee only)
      operationId: updateAbsoluteLimit
      parameters:
        - name: iban
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAbsoluteLimitRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AccountDTO'
  /api/transactions/transfer:
    post:
      tags:
        - Transactions
      summary: Transfer money between two accounts
      operationId: transfer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TransactionDTO'
  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new customer account
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserDTO'
  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout and invalidate the JWT token
      operationId: logout
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Login and receive a JWT token
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LoginResponse'
  /api/atm/withdraw:
    post:
      tags:
        - ATM
      summary: Withdraw cash from an account via ATM
      operationId: withdraw
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtmRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AtmResponse'
  /api/atm/deposit:
    post:
      tags:
        - ATM
      summary: Deposit cash into an account via ATM
      operationId: deposit
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtmRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AtmResponse'
  /api/accounts:
    get:
      tags:
        - Accounts
      summary: Get all customer accounts or accounts for a specific user (employee only)
      operationId: getAccounts
      parameters:
        - name: userId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountDTO'
    post:
      tags:
        - Accounts
      summary: Create a new account
      operationId: createAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AccountDTO'
  /api/users:
    get:
      tags:
        - Users
      summary: Get users with optional status filter
      operationId: getUsers
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - pending
              - without_accounts
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserDTO'
  /api/users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      operationId: getUserById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserDTO'
  /api/transactions:
    get:
      tags:
        - Transactions
      summary: Get all transactions involving the authenticated user's accounts
      operationId: getMyTransactions
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionDTO'
  /api/transactions/all:
    get:
      tags:
        - Transactions
      summary: Get all transactions in the system (employee only)
      operationId: getAllTransactions
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionDTO'
  /api/transactions/account/{iban}:
    get:
      tags:
        - Transactions
      summary: Get transactions for a specific account
      operationId: getByAccount
      parameters:
        - name: iban
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionDTO'
  /api/accounts/{iban}:
    get:
      tags:
        - Accounts
      summary: Get account details by IBAN
      operationId: getByIban
      parameters:
        - name: iban
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AccountDTO'
  /api/accounts/myAccounts:
    get:
      tags:
        - Accounts
      summary: Get all accounts for the authenticated user
      operationId: getMyAccounts
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountDTO'
components:
  schemas:
    UserDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
        bsn:
          type: string
        dateOfBirth:
          type: string
          format: date
        role:
          type: string
          enum:
            - CUSTOMER
            - EMPLOYEE
        approved:
          type: boolean
    UpdateDailyLimitRequest:
      type: object
      properties:
        dayLimit:
          type: number
      required:
        - dayLimit
    AccountDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        iban:
          type: string
        accountType:
          type: string
          enum:
            - CHECKING
            - SAVINGS
        balance:
          type: number
        absoluteLimit:
          type: number
        dayLimit:
          type: number
        transactionLimit:
          type: number
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        ownerUsername:
          type: string
        ownerFullName:
          type: string
    UpdateAbsoluteLimitRequest:
      type: object
      properties:
        absoluteLimit:
          type: number
      required:
        - absoluteLimit
    TransferRequest:
      type: object
      properties:
        fromIban:
          type: string
          minLength: 1
        toIban:
          type: string
          minLength: 1
        amount:
          type: number
          minimum: 0.01
        description:
          type: string
      required:
        - amount
    TransactionDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        reference:
          type: string
        sourceIban:
          type: string
        destinationIban:
          type: string
        amount:
          type: number
        description:
          type: string
        type:
          type: string
          enum:
            - TRANSFER
            - ATM_DEPOSIT
            - ATM_WITHDRAWAL
        timestamp:
          type: string
          format: date-time
        initiatedByUsername:
          type: string
    RegisterRequest:
      type: object
      properties:
        username:
          type: string
          maxLength: 50
          minLength: 3
        password:
          type: string
          maxLength: 2147483647
          minLength: 8
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
        phoneNumber:
          type: string
          minLength: 1
          pattern: ^\+?[0-9]{7,15}$
        bsn:
          type: string
          minLength: 1
          pattern: ^\d{9}$
        dateOfBirth:
          type: string
          format: date
      required:
        - dateOfBirth
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/UserDTO'
    AtmRequest:
      type: object
      properties:
        iban:
          type: string
          minLength: 1
        amount:
          type: number
          minimum: 0.01
        description:
          type: string
      required:
        - amount
    AtmResponse:
      type: object
      properties:
        reference:
          type: string
        newBalance:
          type: number
        message:
          type: string
    CreateAccountRequest:
      type: object
      properties:
        accountType:
          type: string
          enum:
            - CHECKING
            - SAVINGS
        userId:
          type: integer
          format: int64
      required:
        - accountType
  securitySchemes:
    bearerAuth:
      type: http
      in: header
      scheme: bearer
      bearerFormat: JWT
